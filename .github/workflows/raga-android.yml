name: Raga Android app

on:
  push:
    paths: ["raga-assistant/**", ".github/workflows/raga-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raga-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test and build APK
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullRelease assembleLiteRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: raga-apks
          path: raga-assistant/app/build/outputs/apk/*/release/*.apk
